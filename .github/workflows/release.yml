name: Release

# Source-only development prerelease for the library-only Jiku scaffold.
# Tag pushes publish a GitHub prerelease; manual runs are dry runs that only
# upload the workflow artifact.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version and quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve and check release version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          workspace_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [[ "$REF_TYPE" == "tag" ]]; then
            tag_version="${REF_NAME#v}"
            if [[ "$tag_version" != "$workspace_version" ]]; then
              echo "::error::Tag $REF_NAME does not match workspace.package.version $workspace_version"
              exit 1
            fi
          fi
          echo "version=$workspace_version" >> "$GITHUB_OUTPUT"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - name: Resolve pinned Rust channel
        id: rust
        run: echo "channel=$(bash scripts/rust-channel.sh)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt, clippy
      # Equivalent of `just check`; actionlint runs from its pinned image.
      - name: Validate descriptors
        run: just metadata
      - name: Lint shell entry points
        run: just scripts-check
      - name: Lint GitHub workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      - name: Check Rust formatting
        run: just fmt-check
      - name: Check compilation
        run: just typecheck
      - name: Enforce Clippy warnings
        run: just clippy
      - name: Run available tests
        run: just test

  build:
    name: Build source archive
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package source
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          bash scripts/package-source.sh --version "$VERSION" --out dist
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jiku-source
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish GitHub prerelease
    if: github.ref_type == 'tag'
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jiku-source
          path: dist
      - name: Verify checksums
        run: (cd dist && sha256sum -c SHA256SUMS)
      - name: Extract release notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --prerelease \
              --verify-tag \
              --title "Jiku $TAG (development prerelease, library scaffold)" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
