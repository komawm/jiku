# ~/.config/jiku/config.toml — Infrastructure & provider defaults for jikud
# Mounted Read-Only (ro) inside jikud's Bubblewrap / systemd ProtectHome=tmpfs sandbox.
#
# Template values: replace every `<...-model-id>` and `JIKU_*_API_KEY` name with
# your own provider bindings. `api_key_env` names the environment variable that
# holds each key; never inline raw secrets here.

[daemon]
locale = "zh-CN"
socket_name = "jiku.sock"
dropbox_dir = "~/JikuBox"
audit_log = true

[koma]
default_workspace = "ws_01"
default_overlay = "grid_225"
perceptual_hash_threshold = 4
allowed_app_profiles = ["chromium-research", "libreoffice-headless", "gimp-batch"]

# --- Declarative LLM / Decision Model Providers ---

[providers.gemini]
kind = "google_gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta"
api_key_env = "JIKU_DECISION_API_KEY"

[providers.opencode_go]
kind = "opencode_go"
base_url = "https://opencode.ai/inference/go/openai/v1"
api_key_env = "JIKU_PLANNER_API_KEY"
thinking = false

[providers.openai]
kind = "openai_compatible"
base_url = "https://api.openai.com/v1"
api_key_env = "JIKU_OPENAI_API_KEY"

[providers.anthropic]
kind = "anthropic"
base_url = "https://api.anthropic.com/v1"
api_key_env = "JIKU_ANTHROPIC_API_KEY"

[providers.openrouter]
kind = "openai_compatible"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "JIKU_OPENROUTER_API_KEY"

[providers.local_vlm]
kind = "openai_compatible"
base_url = "http://127.0.0.1:8080/v1"
api_key_env = ""
thinking = false

# --- Heterogeneous Role Routing (Three-Driver Model Architecture) ---

[roles.planner]
provider = "opencode_go"
model = "<primary-text-model-id>"
driver = "turn_sse"
thinking = false
temperature = 0.2

[roles.actor]
provider = "gemini"
model = "<decision-model-id>"
driver = "decisions"
coordinate_mode = "grid_225_or_normalized_1000"
temperature = 0.0

# Optional dedicated decision model (provider's native decision model ID).
# `provider` and `model` are required whenever this section is present. When the
# provider key is unavailable at runtime, `jikud` falls back to `[roles.planner]`
# (thinking disabled) via structured JSON emulation without error.
[roles.decision_router]
provider = "gemini"
model = "<decision-model-id>"
driver = "decisions"
optional = true
fallback_to_primary_text_model = true
fast_path_confidence = 0.85
max_questions_per_batch = 8
require_none_or_other = true
require_scope_gate = true

# --- Decision Router & Compiler Policy (`DecisionRouterPolicy`) ---

[decision_router]
decision_provider = "gemini"
decision_model_id = "<decision-model-id>"
primary_provider = "opencode_go"
primary_text_model_id = "<primary-text-model-id>"
fast_path_confidence_threshold = 0.85
max_questions_per_batch = 8

[decision_router.compiler]
fast_path_confidence = 0.85
min_cell_prob = 0.05
time_slot_min_confidence = 0.75
bernoulli_activation_threshold = 0.80
probe_min_prob = 0.15
stop_sentinel = "stop_done"
fallback_token = "NONE_OR_OTHER"

# Spatial grid dimensions (`cols x rows`; must satisfy `2 <= cols * rows <= 255`
# for `/v1beta/decisions` categorical `Choice` questions).
[decision_router.compiler.grid]
cols = 15
rows = 15

# --- Live Session Co-Pilot Configuration (`LiveSessionConfig`) ---
# Disabled until `jiku live` is invoked explicitly.

[live_session]
model = "<live-model-id>"
response_modality = "Audio"
output_audio_transcription = true
proactive_audio = false
enable_affective_dialog = true
uplink_sample_rate_hz = 16000
downlink_sample_rate_hz = 24000
max_screen_fps = 2
context_compression_trigger_tokens = 24000
sliding_window_target_tokens = 12000
session_resumption_enabled = true
require_koma_epoch_fence = true

[roles.live_companion]
provider = "gemini"
model = "<live-model-id>"
driver = "live_websocket"
optional = true
response_modality = "AUDIO"
output_audio_transcription = true
proactive_audio = true
uplink_pcm_hz = 16000
downlink_pcm_hz = 24000
max_screen_fps = 2
trigger_tokens = 10000
sliding_window_target_tokens = 2000
session_resumption = true
non_blocking_tools = true
default_tool_scheduling = "WHEN_IDLE"

[roles.fast_guard]
provider = "local_vlm"
model = "<local-vlm-model-id>"
driver = "turn_sse"
thinking = false
optional = true

# --- JikuBox Multimodal Dropzone Triage (DecisionsDriver) ---

[jikubox.triage]
driver = "decisions"
model = "<decision-model-id>"
max_questions_per_batch = 1000
prefer_noul_checklists = true

# --- Three-Tier Pluggable Memory (SQLite WAL + FTS5) ---

[memory]
backend = "sqlite_fts5"
db_path = "~/.local/state/jiku/state.db"
l0_frame_ring_size = 4
app_quirk_max_chars = 600
stage_new_skills = true

# --- Desktop Notifications (D-Bus -> swaync) ---

[notify]
desktop_dbus = true
app_name = "Jiku"
notify_on = ["task_completed", "task_failed", "verification_needed", "skill_staged"]

# --- Optional TTS & Live2D / VRM Companion EventBus ---

[tts]
enabled = false
provider = "voicevox"
endpoint = "http://127.0.0.1:50021"
speaker_id = 3
speak_on = ["task_completed", "verification_needed"]

[avatar]
emit_cues = true
idle_gaze_follow_vseat = true
